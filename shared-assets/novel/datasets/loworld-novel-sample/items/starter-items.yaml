items:
  - id: leather_gloves
    name: 호완 장갑
    type: gloves
    rarity: normal
    description: 손목과 손등을 보호하는 얇은 장갑.
    flavorText: 오래된 봉선 자국이 남아 있지만 실전에는 아직 충분하다.
