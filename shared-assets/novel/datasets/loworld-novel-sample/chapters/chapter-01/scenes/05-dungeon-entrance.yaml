paragraphs:
  - 북망산 아래에서 불어오는 음풍은 살갗을 바늘처럼 찔렀고, 젖은 돌계단은 끝이 보이지 않는 암흑 속으로 이어지고 있었다. 입구 주변의 억센 풀숲 사이에는 누군가 다급히 달아난 발자국과 무언가를 질질 끈 흔적이 뒤엉켜 있었다.
  - 발밑에서 마른 뼈가 부서지는 소리가 울리자, 당신은 단전에 숨을 가라앉히고 전진했다. 아래쪽 안개 속에서는 낮게 으르렁거리는 소리와 함께 사람의 형체를 한 시귀들이 하나둘 몸을 일으켰다.
  - 이제 물러설 곳은 없었다. 북망산의 사기는 이미 당신의 발목을 감아 왔고, 첫 번째 혈전은 바로 눈앞까지 다가와 있었다.