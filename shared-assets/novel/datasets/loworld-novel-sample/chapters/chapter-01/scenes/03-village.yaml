id: scene_02_village
title: 피비린내 감도는 장시
chronicle:
  id: chronicle_village
  title: 피비린내 감도는 장시
  summary: 청림현 장시에서 의문의 습격 소식을 듣고 북망산 쪽으로 향할 준비를 했다.
  category: story
variations:
  - condition:
      type: item_equipped
      slot: weapon
    insertPosition: replace
    paragraphs:
      - 장시는 여전히 아수라장이었지만, 당신이 검을 쥔 채 나타나자 포쾌들과 상인들이 먼저 시선을 보냈다.
      - 상처 입은 표사가 북망산 공동묘지 쪽에서 검은 옷의 자객들이 나타났다고 이를 갈며 말했다.
      - 무기를 든 협객이 나타났다는 사실만으로도 흩어지던 민심이 잠시 한곳으로 모였다.
  - condition:
      type: item_equipped
      slot: weapon
      itemId: crystal_sword
    insertPosition: replace
    paragraphs:
      - 장시 한복판에서 기이한 검광이 번뜩이자 사람들은 숨을 삼켰다.
      - 백발의 노인은 그 검을 보며 북망산의 혈겁이 이미 당신을 불러낸 것 같다고 속삭였다.
      - 성문을 지키던 포쾌들조차 잠시 발을 멈추고 당신을 주시했다.
revealMonsterIds:
  - fallen
  - zombie
monsterUpdates:
  - id: fallen
    summary: 청림현 장시 부근에서 처음 목격된 흑의 자객 무리.
  - id: zombie
    summary: 북망산 공동묘지 인근에서 나타난 시귀 무리. 움직임은 둔하지만 수가 많다.
partyUpdates:
  - id: akara
    summary: 약방 주인이자 은거 고수인 아카라가 북망산의 이상 징후를 경고하며 지원을 약속했다.
    status: support
  - id: guard_cain
    summary: 북문을 지키던 포쾌가 공동묘지 방면 상황을 알린 뒤 연락이 끊겼다.
    status: missing
choices:
  - id: choice_go_dungeon
    label: 북망산 공동묘지로 향한다
    description: 북문을 지나 사건의 근원지로 직행한다.
    nextSceneId: scene_03_dungeon_entrance
  - id: choice_visit_shop
    label: 떠나기 전에 약방을 들른다
    description: 아카라가 남긴 물자와 조언을 확인한다.
    nextSceneId: scene_02_shop
  - id: choice_shadow_path
    label: 검광이 가리키는 암도를 따른다
    description: 특별한 검기를 지닌 자만 볼 수 있는 비밀 경로다.
    nextSceneId: scene_03_dungeon_entrance
    requiredCondition:
      type: item_equipped
      slot: weapon
      itemId: crystal_sword
    hiddenUntilMet: true
paragraphs:
  - 청림현의 장시는 혼란에 잠겨 있었다.
  - 상인들은 좌판을 내버린 채 도망쳤고, 포쾌들은 북문 쪽으로 몰려들고 있었다. 비에 젖은 흙냄새와 피비린내가 뒤섞인 공기 속에서 백성들은 서로를 밀치며 살길을 찾고 있었다.
  - 그때 백발의 노파가 지팡이를 짚고 다가와 북망산 공동묘지에서 봉인된 사기가 새어 나오고 있다고 경고했다. 그녀는 약방에 마지막으로 쓸 만한 물자와 호신구를 남겨 두었으니, 준비가 부족하다면 먼저 들르라고 말했다.