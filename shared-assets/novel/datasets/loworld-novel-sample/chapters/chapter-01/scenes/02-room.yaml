id: scene_01_room
title: 오래된 검갑
chronicle:
  id: chronicle_room
  title: 검갑 발견
  summary: 객방 평상 밑에서 봉인된 검갑 하나를 찾아냈다.
  category: story
partyUpdates:
  - id: wanderer
    summary: 객방에 숨겨진 검갑에서 예리한 검을 확보해 급한 싸움에 대비하게 됐다.
itemDrops:
  - itemId: short_sword
    title: 장검 획득
    summary: 낡은 검갑 안에서 아직 쓸 만한 장검을 발견했다.
choices:
  - id: choice_take_sword
    label: 장검을 챙기고 장터로 향한다
    description: 무기를 지닌 채 바깥 상황을 확인하러 나간다.
    nextSceneId: scene_02_village
paragraphs:
  - 객방을 둘러보던 당신은 평상 밑에 천으로 덮인 길쭉한 물건 하나를 발견했다.
  - 천을 걷어내자 오래된 검갑이 드러났다. 갑을 열자 안에는 세월의 흔적이 밴 장검 한 자루가 잠들어 있었다. 검날 가장자리에는 옅은 녹이 피어 있었지만, 손잡이를 쥐는 순간 손끝으로 단단한 강기가 전해졌다.
  - 문밖에서는 다급한 발소리와 함께 누군가의 신음이 뒤섞여 들려왔다. 빗물에 씻긴 피 냄새가 창틈으로 스며들었다. 더 늦기 전에 객잔을 벗어나 시전의 상황을 확인해야 했다.